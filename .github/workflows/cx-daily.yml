name: cx daily fix

# the index publishes 365 days a year. 06:20 UTC sits after the overnight
# prints land and well before anyone reads the page.
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the site
        uses: actions/checkout@v4

      - name: checkout the index crate
        uses: actions/checkout@v4
        with:
          repository: cyberia-to/cx
          path: .cx-src

      - name: cache the rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cx-src/target
          key: cx-cargo-${{ hashFiles('.cx-src/Cargo.toml', '.cx-src/src/**') }}

      - name: test
        working-directory: .cx-src
        run: cargo test --release

      - name: build today's fix
        working-directory: .cx-src
        run: cargo run --release -- --out out

      - name: publish the pages
        run: |
          cp .cx-src/out/index.html cx/index.html
          cp .cx-src/out/cx.json cx/cx.json
          if git diff --quiet -- cx; then
            echo "the fix is unchanged; nothing to publish"
            exit 0
          fi
          level=$(sed -n 's/.*"level": \([0-9.]*\).*/\1/p'  cx/cx.json | head -1)
          git config user.name "cx"
          git config user.email "cx@cyberia.my"
          git add cx
          git commit -m "chore(cx): fix of $(date -u +%Y-%m-%d) — ${level}"
          git push

      # the record — history.md, a page of the graph — lives in the cx repository
      # itself, beside the spec. pushing there needs a token with write access
      # to cyberia-to/cx; without the secret the site still publishes and the
      # record waits for the next run that has one.
      - name: publish the record
        if: ${{ env.GRAPH_TOKEN != '' }}
        env:
          GRAPH_TOKEN: ${{ secrets.GRAPH_TOKEN }}
        working-directory: .cx-src
        run: |
          cp out/history.md history.md
          if git diff --quiet -- history.md; then
            echo "the record is unchanged; nothing to write"
            exit 0
          fi
          git config user.name "cx"
          git config user.email "cx@cyberia.my"
          git remote set-url origin "https://x-access-token:${GRAPH_TOKEN}@github.com/cyberia-to/cx.git"
          git add history.md
          git commit -m "chore: record of $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
